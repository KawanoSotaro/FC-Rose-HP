<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <title>ロゼ検定 ホーム</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/quiz.css') }}">
    <style>
        /* 歯車ボタンを右下に固定 */
        .settings-button {
            position: fixed;
            bottom: 40px;
            right: 40px;
            width: 100px;
            height: 100px;
            cursor: pointer;
            z-index: 100;
        }

        /* モーダルの背景、暗くなるやつ */
        .language-modal {
            display: none; /* 最初は非表示 */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 200;
        }

        /* モーダルの中身 */
        .language-modal-content {
            background: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            width: 550px;
            height: 380px;
            display: flex;             /* ← 追加 */
            flex-direction: column;    /* 縦並び */
            align-items: center;       /* 中央寄せ */
            justify-content: center;   /* 上下も中央寄せ */
        }

        .language-modal-content h2 {
            margin-bottom: 30px;
            font-size: 35px;
        }

        .language-option {
            display: block;
            margin: 10px 0;
            padding: 10px;
            width: 300px;
            height: 50px;
            border-radius: 8px;
            background: #f0f0f0;
            text-decoration: none;
            color: black;
            font-weight: bold;
            transition: background 0.3s;
            font-size: 24px; /* ← 文字サイズを大きく */
        }

        .language-option:hover {
            background: #ddd;
        }
        .language-modal-content button {
            font-size: 24px;       /* 文字サイズを大きく */
            padding: 12px 24px;    /* ボタン自体も大きく */
            border-radius: 8px;    /* 角を丸く */
            background-color: #f0f0f0;
            border: none;
            cursor: pointer;
            margin-top: 0px;      /* 上に余白を追加 */
            font-weight: bold;
            transition: background 0.3s;
        }

        .language-modal-content button:hover {
            background-color: #ddd;
        }
    </style>
</head>
<body>
    <!-- 流れる背景 -->
    <div class="scrolling-background-container">
        <div class="scrolling-background row row-top" id="scroll-top">
            <img src="{{ url_for('static', filename='images/quiz_background/bg1.jpeg') }}" alt="">
            <img src="{{ url_for('static', filename='images/quiz_background/bg2.jpeg') }}" alt="">
            <img src="{{ url_for('static', filename='images/quiz_background/bg3.jpeg') }}" alt="">
            <img src="{{ url_for('static', filename='images/quiz_background/bg4.jpeg') }}" alt="">
            <img src="{{ url_for('static', filename='images/quiz_background/bg5.jpeg') }}" alt="">
            <img src="{{ url_for('static', filename='images/quiz_background/bg6.jpeg') }}" alt="">
        </div>
        <div class="scrolling-background row row-middle" id="scroll-middle">
            <img src="{{ url_for('static', filename='images/quiz_background/bg7.jpeg') }}" alt="">
            <img src="{{ url_for('static', filename='images/quiz_background/bg8.jpeg') }}" alt="">
            <img src="{{ url_for('static', filename='images/quiz_background/bg9.JPG') }}" alt="">
            <img src="{{ url_for('static', filename='images/quiz_background/bg10.JPG') }}" alt="">
            <img src="{{ url_for('static', filename='images/quiz_background/bg11.jpeg') }}" alt="">
            <img src="{{ url_for('static', filename='images/quiz_background/bg12.png') }}" alt="">
        </div>
        <div class="scrolling-background row row-bottom" id="scroll-bottom">
            <img src="{{ url_for('static', filename='images/quiz_background/bg13.jpeg') }}" alt="">
            <img src="{{ url_for('static', filename='images/quiz_background/bg14.JPG') }}" alt="">
            <img src="{{ url_for('static', filename='images/quiz_background/bg15.jpeg') }}" alt="">
            <img src="{{ url_for('static', filename='images/quiz_background/bg16.jpeg') }}" alt="">
            <img src="{{ url_for('static', filename='images/quiz_background/bg17.JPG') }}" alt="">
            <img src="{{ url_for('static', filename='images/quiz_background/bg18.png') }}" alt="">
        </div>
    </div>

    <!-- タイトル -->
    <div class="title">
        <img src="{{ url_for('static', filename='images/10.png') }}" alt="ロゼ検定！">
    </div>

    <!-- スタートボタン -->
    <div class="start-button">
        <a href="{{ url_for('quiza') }}">
            <img src="{{ url_for('static', filename='images/starta.png') }}" alt="スタート">
        </a>
    </div>

    <!-- ホームボタン -->
    <div class="home-button">
        <a href="{{ url_for('index') }}">
            <img src="{{ url_for('static', filename='images/homea.png') }}" alt="ホームに戻る">
        </a>
    </div>
    <!-- 設定ボタン -->
    <img src="{{ url_for('static', filename='images/quiz_background/settingbutton.png') }}" 
         alt="設定" class="settings-button" id="settingsBtn">

    <!-- 言語選択モーダル -->
    <div class="language-modal" id="languageModal">
        <div class="language-modal-content">
            <h2>言語を選択してください</h2>
            <a href="{{ url_for('quiz_home') }}" class="language-option">日本語 (Japanese)</a>
            <a href="{{ url_for('quiza_home') }}" class="language-option">(Arabic) العربية</a>
            <br>
            <button onclick="closeModal()">閉じる</button>
        </div>
    </div>

    <!-- JS読み込み -->
    <script src="{{ url_for('static', filename='pdfjs/scroll.js') }}"></script>
    <script>
        const settingsBtn = document.getElementById("settingsBtn");
        const languageModal = document.getElementById("languageModal");

        settingsBtn.addEventListener("click", () => {
            languageModal.style.display = "flex";
        });

        function closeModal() {
            languageModal.style.display = "none";
        }

        // モーダル背景クリックで閉じる
        languageModal.addEventListener("click", (e) => {
            if (e.target === languageModal) {
                closeModal();
            }
        });
    </script>
</body>
</html>
