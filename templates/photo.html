<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ロゼ写真集</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        /* 全体設定 */
    body {
        margin: 0;
        padding: 0;
        font-family: 'ヒラギノ丸ゴ Pro', sans-serif;
        background-color: #fffafb; /* ほんのり温かい白 */
    }

    /* ヘッダー周り（継承） */
    .header {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 120px;
        background-color: #ffecfd;
        display: flex;
        align-items: center;
        justify-content: center;
        border-bottom: 1px solid #ccc;
        z-index: 999;
    }
    .header-img { height: 80px; }

    body > *:not(.header) {
        margin-top: 150px;
    }

    /* タイムラインの土台 */
    .timeline {
        position: relative;
        max-width: 950px;
        margin: 100px auto;
        padding: 30px 0;
    }

    /* 真ん中の縦線 */
    .timeline::before {
        content: '';
        position: absolute;
        top: 0;
        bottom: 0;
        left: 50%;
        width: 4px;
        background: #eec9d2; /* 柔らかいピンクブラウン */
        transform: translateX(-50%);
    }

    /* 各アイテムの並び */
    .timeline-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        margin-bottom: 0px; /* 写真の縦の間隔調整 */
        position: relative;
    }

    /* 右側配置の場合は中身を反転 */
    .timeline-item.right {
        flex-direction: row-reverse;
    }

    /* 写真・テキストボックスの幅 */
    .photo-box, .text-box {
        width: 50%;
    }

    /* ポラロイド風写真の設定 */
    .photo-box img {
        width: 100%;
        height: 400px;
        object-fit: contain;
        background-color: transparent;
        padding: 0;
        box-shadow: none;
        transition: all 0.3s ease;
        cursor: pointer;
    }

    /* 傾き調整 */
    .left .photo-box img { transform: rotate(-5deg); }
    .right .photo-box img { transform: rotate(5deg); }

    .photo-box img:hover {
        transform: rotate(0deg) scale(1.05);
        box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }

    /* テキストボックスの設定 */
    .text-box {
    width: 45%;
    padding: 10px 0;
    display: flex;
    flex-direction: column;
    /* デフォルト（線の右側にある時）は左寄せ */
    align-items: flex-start; 
    text-align: left;
    }

    /* 線の左側に文字が来る場合（.right）の調整 */
    .right .text-box {
        /* 線の左側に文字がある時は、中身をすべて「右寄せ」にする */
        align-items: flex-end;
        text-align: right;
    }
    .date {
        font-size: 32px;
        color: #5c3a3a;
        margin: 0 0 0 0;
    }

    .title {
        font-size: 50px;
        color: #5c3a3a;
        margin: 0;
        display: inline-block;
        border-bottom: 3px solid #ffecfd; /* タイトルの下線 */
    }

    /* 矢印（三角形）の作成 */
    .timeline-item::after {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 0;
        height: 0;
        border-style: solid;
        transform: translateY(-50%);
        z-index: 1;
    }

    /* 左側アイテムの矢印（右を向く） */
    .right::after {
        border-width: 10px 0 10px 15px;
        border-color: transparent transparent transparent #eec9d2;
        margin-left: -2px; /* 線に重なるように調整 */
    }

    /* 右側アイテムの矢印（左を向く） */
    .left::after {
        border-width: 10px 15px 10px 0;
        border-color: transparent #eec9d2 transparent transparent;
        margin-left: -13px; /* 線に重なるように調整 */
    }

    /* レスポンシブ対応（画面が狭い時用） */
    @media (max-width: 768px) {
        .timeline::before { left: 20px; }
        .timeline-item, .timeline-item.right {
            flex-direction: column-reverse;
            align-items: flex-start;
            padding-left: 50px;
        }
        .photo-box, .text-box { width: 90%; }
        .timeline-item::after { display: none; }
    }

    </style>
</head>
